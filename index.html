<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inversiones AS</title>
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inversiones AS">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14213D; --papel:#EEF1F5; --hoja:#FFFFFF; --linea:#D6DCE5; --suave:#5B6678;
  --alejo:#2F5DDB; --sebas:#E59A2F; --banco:#B9C2CF;
  --entra:#2E8B57; --sale:#C2453A; --aviso:#B7791F;
  --radio:14px; --sombra:0 1px 2px rgba(20,33,61,.06),0 6px 24px rgba(20,33,61,.06);
  --disp:'Archivo',system-ui,sans-serif; --cuerpo:'Public Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --tinta:#E8ECF3; --papel:#0E1424; --hoja:#161E31; --linea:#2A3550; --suave:#98A3B8;
  --alejo:#6E8FF0; --sebas:#F0B259; --banco:#3A4762; --entra:#5CC08A; --sale:#EE7A6E; --aviso:#E2A53E;
  --sombra:none; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--papel);color:var(--tinta);font:15px/1.5 var(--cuerpo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--alejo);outline-offset:2px;border-radius:6px}
.num,.disp{font-family:var(--disp);font-variant-numeric:tabular-nums}
.disp{font-stretch:118%;font-weight:700;letter-spacing:-.01em}
.eti{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);font-weight:600}
.suave{color:var(--suave)} .entra{color:var(--entra)} .sale{color:var(--sale)}
a{color:var(--alejo)}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.lado{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--linea);display:flex;flex-direction:column;gap:20px}
.marca{font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:18px;line-height:1.1}
.marca small{display:block;font:500 12px var(--cuerpo);color:var(--suave);letter-spacing:0;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;font-weight:500;color:var(--suave)}
.nav button:hover{background:var(--hoja)}
.nav button[aria-current=page]{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.nav button:focus-visible{outline:2px solid var(--alejo)}
.pie{margin-top:auto;font-size:12px;color:var(--suave);word-break:break-all}
main{padding:28px clamp(16px,4vw,40px) 120px;max-width:1120px;width:100%}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.cab h1{margin:0;font-family:var(--disp);font-stretch:112%;font-size:clamp(24px,3.4vw,34px);line-height:1.05;font-weight:750}
.cab .lugar{color:var(--suave);font-size:14px;margin-top:4px}
select.inv{border:1px solid var(--linea);background:var(--hoja);border-radius:10px;padding:7px 10px}

.rejilla{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.rejilla>*{min-width:0}
.c{background:var(--hoja);border-radius:var(--radio);box-shadow:var(--sombra);padding:20px;border:1px solid var(--linea);min-width:0}
.c h2{margin:0 0 14px;font:600 13px var(--cuerpo);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:flex;justify-content:space-between;align-items:center;gap:8px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}

/* firma: el apto en m² */
.m2 h3{margin:0 0 18px;font-family:var(--disp);font-stretch:110%;font-weight:600;font-size:clamp(20px,2.6vw,28px);line-height:1.2}
.m2 h3 b{font-stretch:125%;font-weight:800;font-size:1.9em;line-height:.9;vertical-align:-.08em}
.cota{position:relative;border-top:1px solid var(--suave);margin:8px 0 10px;height:0}
.cota::before,.cota::after{content:"";position:absolute;top:-6px;height:11px;border-left:1px solid var(--suave)}
.cota::before{left:0}.cota::after{right:0}
.cota span{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:var(--hoja);padding:0 8px;font:600 11px var(--disp);font-stretch:118%;letter-spacing:.08em;color:var(--suave)}
.planta{display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.planta i{aspect-ratio:1;border-radius:3px;background:var(--banco);opacity:0;transform:scale(.6);animation:pone .35s ease forwards}
.planta.quieta i{animation:none;opacity:1;transform:none}
.planta i.banco{background:repeating-linear-gradient(135deg,var(--banco) 0 3px,transparent 3px 6px);border:1px solid var(--banco)}
.planta i.alejo{background:var(--alejo)}.planta i.sebas{background:var(--sebas)}
@keyframes pone{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.planta i{animation:none;opacity:1;transform:none}}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--k)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 20px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--linea)}
.cifras div b{display:block;font-family:var(--disp);font-stretch:112%;font-size:19px;font-weight:700}

.big{font-family:var(--disp);font-stretch:118%;font-weight:750;font-size:clamp(26px,3.6vw,36px);line-height:1.05}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila b.num{white-space:nowrap}
.barra{height:8px;border-radius:99px;background:var(--linea);overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--papel);color:var(--suave);white-space:nowrap}
.chip.alejo{background:color-mix(in srgb,var(--alejo) 14%,transparent);color:var(--alejo)}
.chip.sebas{background:color-mix(in srgb,var(--sebas) 18%,transparent);color:color-mix(in srgb,var(--sebas) 70%,var(--tinta))}
.alerta{border-left:3px solid var(--aviso);background:color-mix(in srgb,var(--aviso) 10%,transparent);padding:10px 12px;border-radius:8px;font-size:14px}

.btn{border:1px solid var(--linea);background:var(--hoja);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--suave)}
.btn.pri{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.btn.peli{color:var(--sale)}
.btn.sm{padding:5px 10px;font-size:13px}
.mas{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--tinta);color:var(--papel);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(20,33,61,.3);z-index:5}

/* movimientos */
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filtros input,.filtros select{border:1px solid var(--linea);background:var(--hoja);border-radius:10px;padding:8px 10px}
.filtros input{flex:1;min-width:160px}
.mesg{margin:0 0 18px}
.mesg header{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;position:sticky;top:0;background:var(--papel);z-index:1}
.mesg header b{font-family:var(--disp);font-stretch:115%;font-size:16px;text-transform:capitalize}
.mov{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px;border-bottom:1px solid var(--linea);cursor:pointer;background:var(--hoja)}
.mov:hover{background:color-mix(in srgb,var(--papel) 50%,var(--hoja))}
.mov:first-of-type{border-radius:12px 12px 0 0}.mov:last-of-type{border-radius:0 0 12px 12px;border-bottom:0}
.mov:only-of-type{border-radius:12px}
.mov .val{font-family:var(--disp);font-stretch:110%;font-weight:650;text-align:right}
.mov small{color:var(--suave);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lista{border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra)}

/* gráficos */
.graf svg{width:100%;height:auto;display:block}
.cat{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.cat .barra{height:10px}

/* agenda */
.rec{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea)}
.rec:last-child{border-bottom:0}
.dia{text-align:center;border:1px solid var(--linea);border-radius:10px;padding:6px 0;line-height:1.1}
.dia b{display:block;font-family:var(--disp);font-stretch:120%;font-size:20px}
.dia span{font-size:11px;text-transform:uppercase;color:var(--suave);letter-spacing:.06em}
.dia.pronto{border-color:var(--aviso);background:color-mix(in srgb,var(--aviso) 12%,transparent)}
.dia.vencido{border-color:var(--sale);background:color-mix(in srgb,var(--sale) 12%,transparent)}

/* formularios */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--hoja);color:var(--tinta);box-shadow:0 24px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(14,20,36,.45);backdrop-filter:blur(2px)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font-family:var(--disp);font-stretch:115%;font-size:22px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--suave)}
input,select,textarea{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;background:var(--papel);font-weight:400;font-size:16px;width:100%}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acc{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.acc div{display:flex;gap:8px}
.segm{display:flex;gap:6px;flex-wrap:wrap}
.segm label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--linea);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--tinta);font-weight:500}
.segm input{width:auto}
.segm label:has(input:checked){background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.linea-mes{display:grid;grid-template-columns:auto 1fr 140px;gap:10px;align-items:center}
.linea-mes input[type=checkbox]{width:18px;height:18px}
.total{background:var(--papel);border-radius:12px;padding:12px 14px}

.pend{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
.marca-p{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--suave);display:grid;place-items:center;font-size:12px;font-weight:700}
.pend.ok .marca-p{border:0;background:var(--entra);color:var(--hoja)}
.chip.caja{background:color-mix(in srgb,var(--entra) 14%,transparent);color:var(--entra)}
.cajal{max-height:560px;overflow:auto;margin:0 -4px}
.cajaf{display:grid;grid-template-columns:minmax(0,1fr) auto 130px;gap:2px 14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.cajaf:hover{background:var(--papel)}
.cajac{display:block}.cajas{text-align:right;font-size:13px}
@media (max-width:520px){.cajaf{grid-template-columns:minmax(0,1fr) auto}.cajas{grid-column:2;font-size:12px}}

.rastro{border:1px solid var(--linea);border-radius:12px;padding:10px 14px;font-size:14px}
.rastro summary{cursor:pointer;font-weight:600;color:var(--suave)}
.rastro ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rastro li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .c{max-width:420px;text-align:left}
.login .planta{margin:22px 0}
.vacio{text-align:center;padding:48px 20px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lado{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--linea);background:var(--papel);z-index:4;gap:12px}
  .lado .pie{display:none}
  .marca small{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav button{white-space:nowrap;padding:7px 11px}
  .s8,.s7,.s6,.s5,.s4{grid-column:span 12}
  main{padding-top:18px}
  .mesg header{top:56px}
}
@media (max-width:520px){.dos{grid-template-columns:1fr}.mov small:last-child{grid-column:1/-1;justify-content:flex-start}.mov small:last-child:empty{display:none}.linea-mes{grid-template-columns:auto 1fr 110px}.cat{grid-template-columns:96px 1fr auto}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script type="module">
// ── Configuración ──────────────────────────────────────────────
// Pega aquí el firebaseConfig de tu proyecto (Firebase → Configuración del proyecto → Tus apps).
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDfFjHVtygzj0wLFj8uH5nwiw61pPGn4XU',
  authDomain: 'inversiones-as-7bf96.firebaseapp.com',
  projectId: 'inversiones-as-7bf96',
  storageBucket: 'inversiones-as-7bf96.firebasestorage.app',
  messagingSenderId: '344286742128',
  appId: '1:344286742128:web:e67c4581c6c83e26bd56b5',
};
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
// ───────────────────────────────────────────────────────────────

import { porMes, cuadre, proyeccion, tasaMes, sumarMeses, metros, proximaFecha, ym, leerValor, esCompra, movsCaja, aportesDe, cuotasPagadas, estadoMes } from './calculos.js';

const CATEGORIAS = {
  gasto: ['Crédito hipotecario', 'Administración', 'Servicios', 'Impuestos', 'Mantenimiento y arreglos', 'Mejoras y dotación', 'Cuota extraordinaria', 'Gestión arriendo', 'Trámites', 'Seguros', 'Abono a capital', 'Ahorro abono extra', 'Compra', 'Otros gastos'],
  ingreso: ['Arriendo', 'Otros ingresos'],
  aporte: ['Aporte socios'],
  ajuste: ['Abono entre socios', 'Cuadre socios', 'Fuera de la inversión'],
  caja: ['Envío a la caja', 'Pago a Yaneth', 'Saldo inicial', 'Fuera de la inversión'],
};
const TIPOS = { gasto: 'Gasto', ingreso: 'Ingreso', aporte: 'Envío de plata', ajuste: 'Abono entre socios', caja: 'Movimiento de caja' };
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const mesTxt = (k, largo) => `${largo ? ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][+k.slice(5, 7) - 1] : MES[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
const fechaTxt = (f) => `${+f.slice(8, 10) || ''} ${MES[+f.slice(5, 7) - 1]} ${f.slice(0, 4)}`.trim();
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmts = {};
function money(n, cur = 'COP') {
  const f = (fmts[cur] ??= new Intl.NumberFormat('es-CO', { style: 'currency', currency: cur, maximumFractionDigits: cur === 'COP' ? 0 : 2 }));
  return f.format(n || 0);
}
function corto(n) {
  const a = Math.abs(n);
  if (a >= 1e6) return `${(n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: a >= 1e8 ? 0 : 1 })} M`;
  if (a >= 1e3) return `${Math.round(n / 1e3).toLocaleString('es-CO')} mil`;
  return Math.round(n).toLocaleString('es-CO');
}
const pct = (x, d = 1) => `${(x * 100).toLocaleString('es-CO', { maximumFractionDigits: d })} %`;

// ── Estado ────────────────────────────────────────────────────
const S = { user: null, cargando: true, sinAcceso: false, invs: {}, movs: [], papelera: [], invId: null, tab: 'resumen', f: { anio: '', tipo: '', q: '' }, demo: false, error: '', yo: null, verComo: null, accesos: [] };
const inv = () => S.invs[S.invId];
const cur = () => inv()?.moneda || 'COP';
// Quién está usando la app. Sin documento de acceso = el dueño (las reglas de Firebase solo dejan entrar a él así).
const yo = () => S.verComo || S.yo || { rol: 'dueño', socio: 'alejo' };
const esSocio = () => yo().rol !== 'administra';
const miCaja = () => yo().caja;
const puede = (m) => esSocio() || (!!m.cuenta && m.cuenta === miCaja());
const nombreCaja = (id) => (inv()?.cajas || []).find((x) => x.id === id)?.nombre || id;
try { S.invId = localStorage.getItem('inv'); } catch {}

// ── Datos: Firebase o vista previa en memoria ────────────────
function ponerMovs(l) { S.movs = l.filter((m) => !m.borrado); S.papelera = l.filter((m) => m.borrado); }

// Rastro: quién registró o cambió cada movimiento y cómo estaba antes. Borrar = mandar a la papelera.
const quienSoy = () => S.yo?.nombre || 'Alejo'; // sin documento de acceso solo entra el dueño
const CAMPOS_MOV = ['tipo', 'fecha', 'valor', 'concepto', 'categoria', 'aportes', 'cuenta', 'nota', 'sentido'];
function foto(m) {
  const f = {};
  for (const k of CAMPOS_MOV) if (m[k] !== undefined && m[k] !== '') f[k] = m[k];
  if (f.aportes) f.aportes = Object.fromEntries(Object.entries(f.aportes).filter(([, v]) => +v).sort());
  return f;
}
const marca = () => ({ por: quienSoy(), fecha: new Date().toISOString() });
const conCambio = (m, x) => [...(m.cambios || []), x].slice(-15);
async function guardarConRastro(nuevo) {
  const previo = S.movs.find((x) => x.id === nuevo.id);
  if (!previo) return api.guardarMov({ ...nuevo, creado: nuevo.creado || marca() });
  if (JSON.stringify(foto(previo)) === JSON.stringify(foto(nuevo))) return;
  return api.guardarMov({ ...nuevo, creado: previo.creado ?? null, cambios: conCambio(previo, { ...marca(), antes: foto(previo) }) });
}
async function aPapelera(id) {
  const m = S.movs.find((x) => x.id === id);
  if (!confirm(`¿Mover "${m.concepto}" a la papelera?\n\nLas cuentas dejan de contarlo. Lo puedes restaurar cuando quieras desde Movimientos → Papelera.`)) return false;
  await api.guardarMov({ ...m, borrado: marca() });
  return true;
}
async function restaurar(id) {
  const { borrado, ...m } = S.papelera.find((x) => x.id === id);
  await api.guardarMov({ ...m, cambios: conCambio(m, { ...marca(), accion: 'lo sacó de la papelera', antes: foto(m) }) });
}
let api;
async function conectarFirebase() {
  const [{ initializeApp }, A, F] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
  const app = initializeApp(FIREBASE_CONFIG), auth = A.getAuth(app), db = F.initializeFirestore(app, { ignoreUndefinedProperties: true });
  let offMovs = null, offInvs = null, offAcc = null;
  const fallo = (e) => { if (e.code === 'permission-denied') S.sinAcceso = true; else S.error = e.message; S.cargando = false; render(); };
  api = {
    entrar: async () => { const p = new A.GoogleAuthProvider(); try { await A.signInWithPopup(auth, p); } catch (e) { if (/popup/.test(e.code)) await A.signInWithRedirect(auth, p); else throw e; } },
    salir: () => A.signOut(auth),
    verMovs(id) {
      offMovs?.();
      S.movs = [];
      offMovs = F.onSnapshot(F.collection(db, 'inversiones', id, 'movimientos'), (q) => { ponerMovs(q.docs.map((d) => d.data())); render(); }, fallo);
    },
    guardarInv: (x) => F.setDoc(F.doc(db, 'inversiones', x.id), x),
    guardarMov: (m) => F.setDoc(F.doc(db, 'inversiones', S.invId, 'movimientos', m.id), m),
    async guardarMovs(ms) {

      ${conSub ? `<div class="s12 alerta">El subsidio de ${money(cr.subsidio, c)} va hasta la cuota ${cr.subsidioHastaCuota} (${mesTxt(finSub)}). Desde ${mesTxt(sumarMeses(finSub, 1))} la cuota sube a cerca de <b>${money(cr.cuotaSinSubsidio + cr.seguros, c)}</b>.</div>` : ''}
      <section class="c s12"><h2>¿Y si abonamos a capital?</h2>

        <div id="sim" style="margin-top:14px">${simular(cr, c, 0, 0, base, desde)}</div>
        <p class="suave" style="font-size:12.5px;margin:10px 0 0">Calculado con ${String(cr.tasaEA).replace('.', ',')}% EA y cuota constante; al abonar, pidan al banco reducir plazo. Es una proyección: el extracto manda.</p></section>
    </div>`;
  },

  socios(i) {
    const c = i.moneda, ec = esCompra(i);
    const q = cuadre(i.socios, S.movs), qc = cuadre(i.socios, S.movs.filter(ec)), qm = cuadre(i.socios, S.movs.filter((m) => !ec(m)));
    const abonos = S.movs.filter((m) => m.tipo === 'ajuste' && m.categoria !== 'Fuera de la inversión').sort((a, b) => b.fecha.localeCompare(a.fecha));

    return `<div class="rejilla">${q.socios.map((s) => {

          <div class="fila"><span>En la compra (cuota inicial y escrituración)</span><b class="num">${money(sc.puesto, c)}</b></div>

      <section class="c s12"><h2>Abonos y cuadres <button class="btn sm" data-act="abono">Registrar abono</button></h2>
        ${deudor ? `<p class="suave" style="margin-top:0">Cada abono de ${esc(deudor.nombre)} baja la diferencia. Cuando llegue a cero, quedan ${i.socios.map((s) => s.pct).join('/')}.</p>` : ''}
        <div>${abonos.map((m) => `<div class="fila" data-mov="${esc(m.id)}" style="cursor:pointer"><span>${esc(m.concepto)}<br><small class="suave">${fechaTxt(m.fecha)}${m.nota ? ' · ' + esc(m.nota) : ''}</small></span><b class="num">${corto(m.valor)}</b></div>`).join('') || '<p class="suave">Aún no hay abonos.</p>'}</div></section></div>`;
  },

  agenda(i) {
    const comp = (i.compromisos || []).map((x) => { const p = cuotasPagadas(x, S.movs); return `<div class="fila"><span><b>${esc(x.nombre)}</b> <span class="chip">${p} de ${x.cuotas}</span><br><small class="suave">${money(x.valorCuota, i.moneda)} al mes · ${esc(x.medio || '')} · termina ${mesTxt(sumarMeses(x.inicio, x.cuotas - 1))}</small></span>
      <span style="text-align:right"><b class="num">${corto((x.cuotas - p) * x.valorCuota)}</b><br><small class="suave">por pagar</small></span></div>
      <div class="barra" style="margin-bottom:10px"><i style="width:${(p / x.cuotas) * 100}%;background:var(--alejo)"></i></div>`; }).join('');
    return `<div class="rejilla">
      <section class="c s7"><h2>Recordatorios <button class="btn sm" data-act="recordatorio">Agregar</button></h2>${agenda(i).map(filaAgenda).join('')}</section>
      <section class="c s5"><h2>Pagos a cuotas</h2>${comp || '<p class="suave">Nada a cuotas.</p>'}
        ${i.contrato ? `<h2 style="margin-top:22px">Contrato de arriendo</h2>
          <div class="fila"><span>Canon</span><b class="num">${money(i.contrato.canon, i.moneda)}</b></div>
          <div class="fila"><span>Vigencia</span><b>${fechaTxt(i.contrato.inicio)} → ${mesTxt(sumarMeses(ym(i.contrato.inicio), i.contrato.meses - 1))}</b></div>

          <div class="fila"><span>Modalidad</span><b>${esc(i.contrato.modalidad)}</b></div>` : ''}</section></div>`;
  },

  inversion(i) {
    return `<div class="rejilla"><section class="c s8"><h2>Datos de la inversión</h2>
      <form data-act="datos" style="display:flex;flex-direction:column;gap:14px">${CAMPOS.map(([g, campos]) => `<fieldset style="border:0;padding:0;margin:0 0 6px"><legend class="eti" style="margin-bottom:8px">${g}</legend><div class="dos">
        ${campos.filter(([p]) => p.startsWith('credito.') ? i.credito : p.startsWith('contrato.') ? i.contrato : true).map(([p, t, tipo]) => `<label>${t}<input name="${p}" ${tipo === 'n' ? 'inputmode="decimal"' : tipo === 'f' ? 'type="date"' : ''} value="${esc(tipo === 'n' ? fmtN(leer(i, p)) : leer(i, p) ?? '')}"></label>`).join('')}</div></fieldset>`).join('')}
        ${i.socios.map((s, k) => `<div class="dos"><label>Socio ${k + 1}<input name="socio.${k}.nombre" value="${esc(s.nombre)}"></label><label>% de participación<input name="socio.${k}.pct" inputmode="decimal" value="${s.pct}"></label></div>`).join('')}
        ${(i.fijos || []).map((f, k) => `<label>Valor fijo · ${esc(f.concepto)}<input name="fijo.${k}" inputmode="numeric" value="${fmtN(f.valor)}"></label>`).join('')}
        <div class="acc"><span></span><div>${i.credito ? '' : '<button class="btn" type="button" data-act="addCredito">Agregar crédito</button>'}${i.contrato ? '' : '<button class="btn" type="button" data-act="addContrato">Agregar contrato</button>'}<button class="btn pri">Guardar cambios</button></div></div></form></section>
      <section class="c s4"><h2>Respaldo</h2><p class="suave" style="margin-top:0">Descarga todo (datos y movimientos) en un archivo. Hazlo de vez en cuando.</p>
        <button class="btn" data-act="exportar">Descargar respaldo</button>
        <h2 style="margin-top:24px">Importar</h2><p class="suave" style="margin-top:0">Carga un archivo de historial o un respaldo.</p>
        <label class="btn" style="flex-direction:row;color:var(--tinta);display:inline-flex">Elegir archivo<input type="file" accept="application/json" data-act="importar" hidden></label></section>
      ${!S.yo && !S.verComo ? vistaAccesos(i) : ''}</div>`;
  },

  caja(i) {
    const cj = (i.cajas || [])[0], c = i.moneda;
    if (!cj) return '<div class="c vacio"><p class="suave">Esta inversión no tiene una caja administrada.</p></div>';
    const l = movsCaja(S.movs, cj.id), ult = l.at(-1), saldo = Math.round(ult?.saldo || 0), mia = miCaja() === cj.id;
    const entra = {}, sale = {};
    for (const m of l) {
      if (m.efecto > 0) { const k = m.de || Object.keys(m.aportes || {}).find((x) => m.aportes[x] > 0) || 'otros'; entra[k] = (entra[k] || 0) + m.efecto; }
      else sale[m.categoria] = (sale[m.categoria] || 0) - m.efecto;
    }
    const nom = (k) => i.socios.find((s) => s.id === k)?.nombre || 'Otros (saldo inicial, arrendataria)';
    const topSale = Object.entries(sale).sort((a, b) => b[1] - a[1]);
    return `<div class="rejilla">
      <section class="c s7"><h2>Caja de ${esc(cj.nombre)} ${ult ? `<span class="eti">al ${fechaTxt(ult.fecha)}</span>` : ''}</h2>
        <div class="big num ${saldo < 0 ? 'sale' : ''}">${money(Math.abs(saldo), c)}</div>
        <p class="suave" style="margin:6px 0 16px">${saldo < 0 ? `<b>Le deben a ${esc(cj.nombre)}.</b> Ha pagado esto de su plata y se le devuelve con el próximo envío.` : saldo > 0 ? `${esc(cj.nombre)} tiene esta plata de ustedes para los próximos pagos.` : 'La caja está en cero.'}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn pri" data-act="recibir">${mia ? 'Recibí plata' : `Envié plata a ${esc(cj.nombre)}`}</button>
          <button class="btn" data-act="pagarCaja">${mia ? 'Pagué algo' : `${esc(cj.nombre)} pagó algo`}</button>
          <button class="btn" data-act="otroCaja">Otro movimiento</button></div>
        <div class="graf" style="margin-top:22px">${grafSaldo(l, c)}</div>
        <p class="suave" style="font-size:12.5px;margin:6px 0 0">Saldo en el tiempo. Por debajo de la línea, ${esc(cj.nombre)} estaba poniendo de su plata.</p></section>
      <section class="c s5"><h2>Quién ha enviado</h2>
        ${Object.entries(entra).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="fila"><span>${esc(nom(k))}</span><b class="num entra">${money(v, c)}</b></div>`).join('') || '<p class="suave">Nada aún.</p>'}
        <h2 style="margin-top:20px">En qué se fue</h2>
        ${topSale.slice(0, 6).map(([k, v]) => `<div class="fila"><span>${esc(k)}</span><b class="num">${money(v, c)}</b></div>`).join('') || '<p class="suave">Nada aún.</p>'}</section>
      <section class="c s12"><h2>Movimientos de la caja <span class="eti">${l.length}</span></h2>
        <div class="cajal">${[...l].reverse().map((m) => `<div class="cajaf" data-mov="${esc(m.id)}" tabindex="0" role="button">
          <span><span class="cajac">${esc(m.concepto)}</span><small class="suave">${fechaTxt(m.fecha)} · ${esc(m.categoria)}</small></span>
          <b class="num ${m.efecto > 0 ? 'entra' : ''}">${m.efecto > 0 ? '+' : '−'}${money(Math.abs(m.efecto), c)}</b>
          <span class="num suave cajas">${money(m.saldo, c)}</span></div>`).join('') || '<p class="suave">Aún no hay movimientos.</p>'}</div></section></div>`;

function vistaPapelera(i) {

  return `<p><button class="btn" data-act="papelera">← Volver a movimientos</button></p>
    <section class="c"><h2>Papelera <span class="eti">${l.length}</span></h2>
    <p class="suave" style="margin-top:0">Lo que se borra queda aquí y no cuenta en ninguna cuenta. Restáuralo si fue un error.</p>
    ${l.map((m) => `<div class="fila"><span>${esc(m.concepto)} · <b class="num">${money(m.valor, c)}</b><br>
      <small class="suave">${fechaTxt(m.fecha)} · ${esc(m.categoria)} · lo borró ${esc(m.borrado.por)} el ${fechaTxt(m.borrado.fecha.slice(0, 10))}</small></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${puede(m) ? `<button class="btn sm" data-act="restaurar" data-id="${esc(m.id)}">Restaurar</button>` : ''}
      ${dueno ? `<button class="btn sm peli" data-act="borrarSiempre" data-id="${esc(m.id)}">Borrar para siempre</button>` : ''}</span></div>`).join('') || '<p class="suave">La papelera está vacía.</p>'}</section>`;

function vistaAccesos(i) {
  const roles = [...i.socios.filter((s) => s.id !== 'alejo').map((s) => [`socio:${s.id}`, `Socio · ${s.nombre} (ve y edita todo)`, { rol: 'socio', socio: s.id, nombre: s.nombre }]),
    ...(i.cajas || []).flatMap((x) => [[`todo:${x.id}`, `${x.nombre} · ve y edita todo (sus pagos salen de su caja)`, { rol: 'socio', caja: x.id, nombre: x.nombre }],
      [`administra:${x.id}`, `${x.nombre} · ve todo, edita solo su caja`, { rol: 'administra', caja: x.id, nombre: x.nombre }]])];
  const etiqueta = (a) => (a.rol === 'administra' ? 'Ve todo, edita solo su caja' : a.caja ? 'Ve y edita todo · maneja la caja' : 'Socio · ve y edita todo');
  return `<section class="c s12"><h2>Quién puede entrar</h2>
    <p class="suave" style="margin-top:0">Tú siempre tienes acceso. Agrega aquí el Gmail de cada persona; sin esto, la app no la deja entrar.</p>
    ${S.accesos.map((a) => `<div class="fila"><span><b>${esc(a.nombre)}</b> · ${esc(a.email)}<br><small class="suave">${etiqueta(a)}</small></span>
      <span style="display:flex;gap:6px"><button class="btn sm" data-act="verComo" data-v="${esc(JSON.stringify(a))}">Ver como</button><button class="btn sm peli" data-act="quitarAcceso" data-email="${esc(a.email)}">Quitar</button></span></div>`).join('') || '<p class="suave">Por ahora solo entras tú.</p>'}

    <p class="suave" style="margin:18px 0 8px">Antes de dar acceso, mira la app como la verá cada uno:</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${roles.map(([, , x]) => `<button class="btn sm" data-act="verComo" data-v="${esc(JSON.stringify(x))}">Ver como ${esc(x.nombre)}</button>`).join('')}</div></section>`;

function quienTxt(m, i) {
  if (m.cuenta) return `${m.tipo === 'gasto' ? 'Pagó' : 'Llegó a'} la caja de ${nombreCaja(m.cuenta)}`;
  const nz = Object.entries(m.aportes || {}).filter(([, v]) => v);
  if (!nz.length) return 'Del aporte del mes';
  if (nz.length > 1) return 'Mitad y mitad';
  const n = i.socios.find((s) => s.id === nz[0][0])?.nombre || nz[0][0];
  return m.tipo === 'ingreso' ? `Lo recibió ${n}` : `Pagó ${n}`;
}

function grafSaldo(l, c) {
  if (l.length < 2) return '<p class="suave">Aún no hay suficientes movimientos.</p>';
  const W = 640, H = 150, v = l.map((m) => m.saldo), hi = Math.max(...v, 0), lo = Math.min(...v, 0), k = (H - 16) / (hi - lo || 1);
  const x = (n) => (n * (W - 8)) / (l.length - 1), y = (s) => 8 + (hi - s) * k, z = y(0);
  const d = l.map((m, n) => `${n ? `H${x(n).toFixed(1)}V` : `M0,`}${y(m.saldo).toFixed(1)}`).join('');
  const anios = l.map((m, n) => (n === 0 || m.fecha.slice(0, 4) !== l[n - 1].fecha.slice(0, 4) ? `<text x="${x(n) + 2}" y="${H + 14}" font-size="11" fill="var(--suave)" font-family="Public Sans">${m.fecha.slice(0, 4)}</text>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H + 20}" role="img" aria-label="Saldo de la caja: hoy ${money(v.at(-1), c)}">
    <rect x="0" y="${z}" width="${W}" height="${Math.max(H - z, 0)}" fill="var(--sale)" opacity=".07"/>
    <line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--suave)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${d}" fill="none" stroke="var(--tinta)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${W - 8}" cy="${y(v.at(-1))}" r="4" fill="var(${v.at(-1) < 0 ? '--sale' : '--entra'})"/>${anios}
    <text x="${W - 6}" y="${z - 5}" text-anchor="end" font-size="11" fill="var(--suave)" font-family="Public Sans">0</text></svg>`;
}

const CAMPOS = [
  ['General', [['nombre', 'Nombre'], ['detalle', 'Detalle (torre, apto)'], ['ubicacion', 'Ubicación'], ['moneda', 'Moneda (COP, USD…)'], ['area', 'Área m²', 'n'], ['precioCompra', 'Precio de compra', 'n'], ['valorEstimado', 'Valor estimado hoy', 'n']]],
  ['Crédito (del último extracto)', [['credito.banco', 'Banco'], ['credito.saldo', 'Saldo', 'n'], ['credito.saldoFecha', 'Fecha del extracto', 'f'], ['credito.proximaCuota', 'Número de la próxima cuota', 'n'], ['credito.plazo', 'Plazo en meses', 'n'], ['credito.tasaEA', 'Tasa cobrada % EA', 'n'], ['credito.cuotaSinSubsidio', 'Cuota sin subsidio ni seguros', 'n'], ['credito.subsidio', 'Subsidio mensual', 'n'], ['credito.subsidioHastaCuota', 'Subsidio hasta la cuota #', 'n'], ['credito.seguros', 'Seguros al mes', 'n'], ['credito.monto', 'Monto desembolsado', 'n'], ['credito.desembolso', 'Fecha de desembolso', 'f']]],
  ['Contrato de arriendo', [['contrato.canon', 'Canon mensual', 'n'], ['contrato.inicio', 'Inicio', 'f'], ['contrato.meses', 'Duración (meses)', 'n'], ['contrato.diaPago', 'Días de pago'], ['contrato.deposito', 'Depósito', 'n'], ['contrato.modalidad', 'Modalidad']]],
];
const leer = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const fmtN = (n) => (n || n === 0 ? Number(n).toLocaleString('es-CO', { maximumFractionDigits: 2 }) : '');
function poner(o, p, v) { const ks = p.split('.'); ks.slice(0, -1).reduce((a, k) => (a[k] ??= {}), o)[ks.at(-1)] = v; }

function filaMov(m, c, i) {
  const signo = m.tipo === 'ingreso' ? '+' : m.tipo === 'gasto' ? '−' : m.tipo === 'caja' ? (m.sentido === 'sale' ? '−' : '+') : '';
  const chips = (m.cuenta ? `<span class="chip caja">Caja ${esc(nombreCaja(m.cuenta))}</span>` : '')
    + Object.entries(m.aportes || {}).filter(([, v]) => v).map(([k, v]) => `<span class="chip ${esc(k)}">${esc(i.socios.find((s) => s.id === k)?.nombre || k)} ${corto(v)}</span>`).join('');
  return `<div class="mov" data-mov="${esc(m.id)}" tabindex="0" role="button"><span>${esc(m.concepto)}</span>
    <span class="val ${m.tipo === 'ingreso' ? 'entra' : m.tipo === 'gasto' ? '' : 'suave'}">${signo}${money(m.valor, c)}</span>
    <small>${fechaTxt(m.fecha)} · ${esc(m.categoria)}${m.nota ? ` · ${esc(m.nota.length > 60 ? m.nota.slice(0, 60) + '…' : m.nota)}` : ''}</small><small style="justify-content:flex-end">${chips}</small></div>`;
}

function grafFlujo(meses, keys, c) {
  if (!keys.length) return '<p class="suave">Sin datos.</p>';
  const vals = keys.map((k) => meses[k].ingresos - meses[k].gastos);
  const W = 640, H = 200, alto = Math.max(...vals, 0), bajo = Math.min(...vals, 0), k1 = (H - 10) / (alto - bajo || 1), z = 5 + alto * k1;
  const bw = W / keys.length;
  const barras = keys.map((k, n) => {
    const v = vals[n], h = Math.max(Math.abs(v) * k1, 1.5);
    return `<rect x="${n * bw + 2}" y="${v >= 0 ? z - h : z}" width="${bw - 4}" height="${h}" rx="2" fill="var(${v >= 0 ? '--entra' : '--sale'})" opacity="${k === ym(hoy()) ? 1 : 0.78}"><title>${mesTxt(k)}: ${money(v, c)}</title></rect>
      ${k.endsWith('-01') || n === 0 ? `<text x="${n * bw + 2}" y="${H + 14}" font-size="11" fill="var(--suave)" font-family="Public Sans">${k.slice(0, 4)}</text>` : ''}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H + 20}" role="img" aria-label="Flujo de los últimos ${keys.length} meses">
    ${barras}<line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--suave)" stroke-width="1"/>
    <text x="${W}" y="${z - 4}" text-anchor="end" font-size="11" fill="var(--suave)" font-family="Public Sans">0</text></svg>`;
}

function simular(cr, c, u, mm, base, desde) {
  const r = proyeccion(cr, u, mm);
  if (!u && !mm) return `<p style="margin:0">Hoy terminan de pagar en <b>${mesTxt(sumarMeses(desde, base.meses - 1))}</b> y faltan unos <b class="num">${money(base.intereses, c)}</b> en intereses.</p>`;
  return `<div class="cifras" style="margin:0;padding:0;border:0">
    <div><span class="eti">Terminan en</span><b>${mesTxt(sumarMeses(desde, r.meses - 1))}</b></div>
    <div><span class="eti">Meses menos</span><b class="entra">${base.meses - r.meses}</b></div>
    <div><span class="eti">Ahorran en intereses</span><b class="entra">${corto(base.intereses - r.intereses)}</b></div></div>`;
}

function agenda(i) {
  const h = hoy(), l = (i.recordatorios || []).map((r) => ({ ...r, prox: proximaFecha(r, h) }));
  const mesSig = (d) => { const f = `${h.slice(0, 8)}${String(d).padStart(2, '0')}`; return f >= h ? f : sumarMeses(h.slice(0, 7), 1) + '-' + String(d).padStart(2, '0'); };
  if (i.credito) l.push({ id: '_cuota', auto: true, titulo: `Pagar cuota del crédito (${i.credito.banco})`, prox: mesSig(i.credito.diaPago || 10), repite: 'mensual' });
  if (i.contrato) l.push({ id: '_arriendo', auto: true, titulo: `Llega el arriendo (días ${i.contrato.diaPago})`, prox: mesSig(parseInt(i.contrato.diaPago) || 5), repite: 'mensual' });
  return l.sort((a, b) => a.prox.localeCompare(b.prox));
}
function filaAgenda(r) {
  const dias = Math.round((new Date(r.prox) - new Date(hoy())) / 864e5);
  const cls = dias < 0 ? 'vencido' : dias <= 30 ? 'pronto' : '';
  const cuando = dias < 0 ? `hace ${-dias} días` : dias === 0 ? 'hoy' : dias === 1 ? 'mañana' : dias <= 60 ? `en ${dias} días` : mesTxt(r.prox);
  return `<div class="rec"><div class="dia ${cls}"><b>${+r.prox.slice(8, 10)}</b><span>${MES[+r.prox.slice(5, 7) - 1]} ${r.prox.slice(2, 4)}</span></div>
    <div><b>${esc(r.titulo)}</b><br><small class="suave">${cuando}${r.repite !== 'no' ? ` · cada ${r.repite === 'anual' ? 'año' : 'mes'}` : ''}${r.nota ? ' · ' + esc(r.nota) : ''}</small></div>
    ${r.auto ? '' : `<div style="display:flex;gap:6px"><button class="btn sm" data-act="hecho" data-id="${esc(r.id)}">Hecho</button><button class="btn sm" data-act="recordatorio" data-id="${esc(r.id)}" aria-label="Editar">Editar</button></div>`}</div>`;
}

const dlg = $('#dlg');
function abrir(html, alEnviar) {
  dlg.innerHTML = html;
  const f = $('form', dlg);
  f.onsubmit = async (e) => {
    e.preventDefault();
    const b = $('button.pri', f); b.disabled = true;
    try { await alEnviar(new FormData(f), f, e.submitter); dlg.close(); }
    catch (err) { b.disabled = false; alert(`No se pudo guardar: ${err.message}`); }
  };
  if (!dlg.open) dlg.showModal();
  $('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not(:disabled),select', f)?.focus();
}
const cerrarBtn = '<button type="button" class="btn" data-act="cerrar">Cancelar</button>';

// De quién salió (gasto) o quién recibió (ingreso) un movimiento ya guardado
function quienDe(m, i) {
  if (m.cuenta) return 'caja:' + m.cuenta;
  const nz = Object.entries(m.aportes || {}).filter(([, v]) => v);
  if (!nz.length) return 'mes';
  if (nz.length === 1 && Math.abs(nz[0][1]) === m.valor) return nz[0][0];
  const mi = aportesDe('mitad', m.valor, m.tipo, i.socios);
  return i.socios.every((s) => Math.abs((m.aportes[s.id] || 0) - mi[s.id]) <= 1) ? 'mitad' : 'igual';
}

function formMov(m) {
  if (m.tipo === 'caja') return formCaja(m);
  const i = inv(), c = i.moneda, nuevo = !m.id, cajas = i.cajas || [], admin = !esSocio(), editable = nuevo || puede(m);
  m = { tipo: 'gasto', fecha: hoy(), concepto: '', categoria: '', valor: '', nota: '', aportes: {}, ...m };
  const esAbono = m.tipo === 'ajuste' && m.categoria === 'Abono entre socios';
  const de = esAbono ? Object.entries(m.aportes).find(([, v]) => v > 0)?.[0] : null, para = esAbono ? Object.entries(m.aportes).find(([, v]) => v < 0)?.[0] : null;
  // Por defecto: quien maneja la caja paga desde su caja; un socio, de su bolsillo; un envío lo hace un socio
  const porDefecto = m.tipo === 'aporte' ? yo().socio || i.socios[0].id : m.cuenta ? 'caja:' + m.cuenta : miCaja() ? 'caja:' + miCaja() : yo().socio || i.socios[0].id;
  const quien = m.quien || (nuevo ? porDefecto : quienDe(m, i));
  const destino = m.tipo === 'aporte' ? (m.cuenta ?? (nuevo ? miCaja() || cajas[0]?.id || '' : '')) : '';
  const op = (v, t) => `<label><input type="radio" name="quien" value="${esc(v)}" ${quien === v ? 'checked' : ''}>${esc(t)}</label>`;
  const opsCaja = cajas.filter((x) => !admin || x.id === miCaja()).map((x) => op('caja:' + x.id, `Caja de ${x.nombre}`)).join('');
  const opsSocios = admin && m.tipo !== 'aporte' ? '' : i.socios.map((s) => op(s.id, s.nombre)).join('');
  const legado = (quien === 'mes' ? op('mes', 'Incluido en el aporte del mes') : '') + (quien === 'igual' ? op('igual', 'Como está registrado') : '');
  const pregunta = { gasto: ['¿Quién pagó?', opsSocios + opsCaja + (admin ? '' : op('mitad', 'Mitad y mitad')) + legado],
    ingreso: ['¿Quién lo recibió?', opsSocios + opsCaja + legado],
    aporte: ['¿Quién envió la plata?', opsSocios + (destino ? op('otro', 'Otra persona (arrendatario…)') : '') + (quien === 'mitad' ? op('mitad', 'Mitad y mitad') : '') + legado] }[m.tipo];
  const tipos = admin ? [] : ['gasto', 'ingreso', 'aporte'];
  const titulo = !editable ? 'Detalle' : nuevo ? (esAbono ? 'Abono entre socios' : m.tipo === 'aporte' ? (destino ? `Plata para la caja de ${nombreCaja(destino)}` : 'Envío de plata') : m.tipo === 'ingreso' ? 'Nuevo ingreso' : 'Nuevo pago') : 'Editar movimiento';
  abrir(`<form data-mov-id="${esc(m.id || '')}">
    <h2>${titulo}</h2>
    <fieldset ${editable ? '' : 'disabled'} style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0">
    ${m.tipo === 'ajuste' || !tipos.length || !nuevo ? `<input type="hidden" name="tipo" value="${esc(m.tipo)}">` : `<div class="segm" role="radiogroup" aria-label="Tipo">${tipos.map((k) => `<label><input type="radio" name="tipo" value="${k}" ${m.tipo === k ? 'checked' : ''}>${{ gasto: 'Pago', ingreso: 'Ingreso', aporte: 'Envío de plata' }[k]}</label>`).join('')}</div>`}
    <div class="dos"><label>Fecha<input type="date" name="fecha" value="${esc(m.fecha)}" required></label>
      <label>Valor<input name="valor" inputmode="decimal" required value="${esc(fmtN(m.valor))}" placeholder="0"></label></div>
    <label>Concepto<input name="concepto" required value="${esc(m.concepto)}" placeholder="${esAbono ? 'Abono para igualar' : m.tipo === 'aporte' ? 'Ej. Envío para la admon' : 'Ej. Arreglo de la ducha'}"></label>
    ${esAbono ? `<div class="dos"><label>Quién paga<select name="de">${i.socios.map((s) => `<option value="${esc(s.id)}" ${s.id === de ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></label>
      <label>A quién<select name="para">${i.socios.map((s, k) => `<option value="${esc(s.id)}" ${s.id === para || (!para && k === 1) ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></label></div>
      <input type="hidden" name="categoria" value="${esc(m.categoria || 'Abono entre socios')}">`
    : `${m.tipo === 'aporte' ? `<input type="hidden" name="categoria" value="${esc(m.categoria || 'Aporte socios')}">` : `<label>Categoría<input name="categoria" list="cats" value="${esc(m.categoria)}" placeholder="Elige o escribe una"></label>
      <datalist id="cats">${(CATEGORIAS[m.tipo] || []).map((x) => `<option value="${esc(x)}">`).join('')}</datalist>`}
      <div><div class="eti" style="margin-bottom:8px">${pregunta[0]}</div><div class="segm" role="radiogroup" aria-label="${esc(pregunta[0])}">${pregunta[1]}</div></div>
      ${m.tipo === 'aporte' && !admin && cajas.length ? `<label>¿A dónde llegó?<select name="destino"><option value="">Directo al apto (no pasa por una caja)</option>${cajas.map((x) => `<option value="${esc(x.id)}" ${destino === x.id ? 'selected' : ''}>Caja de ${esc(x.nombre)}</option>`).join('')}</select></label>`
        : `<input type="hidden" name="destino" value="${esc(destino)}">`}`}
    <label>Nota<textarea name="nota" rows="2" placeholder="Opcional">${esc(m.nota)}</textarea></label></fieldset>
    ${nuevo ? '' : rastroHtml(m.id)}
    <div class="acc">${nuevo || !editable ? '<span></span>' : '<button type="button" class="btn peli" data-act="borrarMov">Mover a la papelera</button>'}<div>${editable ? `${cerrarBtn}<button class="btn pri">${nuevo ? 'Guardar' : 'Guardar cambios'}</button>` : '<button type="button" class="btn" data-act="cerrar">Cerrar</button>'}</div></div></form>`,
  async (fd) => {
    const valor = leerValor(fd.get('valor')), q = fd.get('quien');
    let tipo = fd.get('tipo'), cuenta = null, aportes = {};
    if (valor <= 0) throw new Error('El valor debe ser mayor a 0.');
    if (esAbono) {
      if (fd.get('de') === fd.get('para')) throw new Error('Quién paga y a quién deben ser socios distintos.');
      aportes = { [fd.get('de')]: valor, [fd.get('para')]: -valor };
    } else {
      if (!q) throw new Error(`Elige: ${pregunta[0].toLowerCase()}`);
      if (tipo === 'aporte') {
        cuenta = fd.get('destino') || null;
        if (q === 'otro') tipo = 'ingreso';
        else aportes = q === 'igual' ? m.aportes : aportesDe(q, valor, 'aporte', i.socios);
      } else if (q.startsWith('caja:')) cuenta = q.slice(5);
      else if (q === 'igual') aportes = m.aportes;
      else if (q !== 'mes') aportes = aportesDe(q, valor, tipo, i.socios);
    }
    const { cuenta: _c, quien: _q, de: _d, ...resto } = m;
    await guardarConRastro({ ...resto, id: m.id || nuevoId(), tipo, fecha: fd.get('fecha'), valor, concepto: fd.get('concepto').trim(),
      categoria: (fd.get('categoria') || '').trim() || (tipo === 'ingreso' ? 'Otros ingresos' : CATEGORIAS[tipo]?.at(-1) ?? 'Otros'),
      nota: fd.get('nota').trim(), aportes, ...(cuenta ? { cuenta } : {}) });
  });
  const f = $('form', dlg);
  // Al cambiar el tipo cambian las preguntas: se redibuja con lo ya escrito
  f.addEventListener('change', (e) => {
    if (e.target.name !== 'tipo') return;
    const fd = new FormData(f);
    formMov({ ...m, tipo: e.target.value, quien: undefined, cuenta: undefined, categoria: '', fecha: fd.get('fecha'), valor: leerValor(fd.get('valor')) || '', concepto: fd.get('concepto'), nota: fd.get('nota') });
  });
  $('[data-act=borrarMov]', f)?.addEventListener('click', async () => {
    if (await aPapelera(m.id)) dlg.close();
  });
}

function rastroHtml(id) {
  const m = S.movs.find((x) => x.id === id), c = cur();
  if (!m || (!m.creado && !m.cambios?.length)) return '';
  const cuando = (iso) => new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const dif = (a, b) => {
    const q = (x) => quienTxt({ tipo: x.tipo, cuenta: x.cuenta, aportes: x.aportes }, inv());
    const l = [];
    if (a.valor !== b.valor) l.push(`valor ${money(a.valor, c)} → ${money(b.valor, c)}`);
    if (a.fecha !== b.fecha) l.push(`fecha ${fechaTxt(a.fecha)} → ${fechaTxt(b.fecha)}`);
    if (a.concepto !== b.concepto) l.push(`concepto "${esc(a.concepto)}" → "${esc(b.concepto)}"`);
    if (q(a) !== q(b)) l.push(`${esc(q(a))} → ${esc(q(b))}`);
    if (a.categoria !== b.categoria) l.push(`categoría ${esc(a.categoria)} → ${esc(b.categoria)}`);
    if ((a.nota || '') !== (b.nota || '')) l.push('la nota');
    return l.join(' · ');
  };
  const filas = (m.cambios || []).map((x, k) => {
    const despues = foto(k + 1 < m.cambios.length ? m.cambios[k + 1].antes : m);
    return `<li><span><b>${esc(x.por)}</b> ${esc(x.accion || 'cambió')} ${dif(x.antes, despues)}<br><small class="suave">${cuando(x.fecha)}</small></span>
      ${puede(m) && !x.accion ? `<button type="button" class="btn sm" data-volver="${k}">Volver a como estaba</button>` : ''}</li>`;
  }).reverse();
  return `<details class="rastro"><summary>Historial · ${m.cambios?.length ? `${m.cambios.length} cambio${m.cambios.length > 1 ? 's' : ''}` : 'sin cambios'}</summary><ul>
    ${filas.join('')}${m.creado ? `<li><span>Registrado por <b>${esc(m.creado.por)}</b><br><small class="suave">${cuando(m.creado.fecha)}</small></span></li>` : ''}</ul></details>`;
}

});

    <label>Concepto<input name="concepto" required value="${esc(m.concepto)}" placeholder="Ej. Abono a Yaneth"></label>
    <label>Categoría<select name="categoria">${[...new Set([m.categoria, ...CATEGORIAS.caja])].map((x) => `<option ${x === m.categoria ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>

}

async function importarArchivo(file) {
  const data = JSON.parse(await file.text());
  if (data.tipo === 'parche') {
    const x = S.invs[data.inversion];
    if (!x || !Array.isArray(data.movimientos)) throw new Error('Primero importa el historial de esa inversión.');
    if (!confirm(`${data.descripcion}.\n\nSe actualizan ${data.movimientos.length} movimientos del historial. Lo que hayas agregado tú no se toca. ¿Aplicar?`)) return;
    elegirInv(x.id);
    await api.guardarInv({ ...x, ...data.set });
    await api.guardarMovs(data.movimientos);
    S.tab = 'caja'; render(); return alert('Listo. Revisa la caja y los movimientos.');
  }
  if (!data.inversion?.id || !Array.isArray(data.movimientos)) throw new Error('El archivo no tiene el formato de historial.');
  if (S.invs[data.inversion.id] && !confirm(`"${data.inversion.nombre}" ya existe. ¿Reemplazar sus datos con los del archivo? Los movimientos con el mismo id se sobrescriben.`)) return;
  await api.importar(data);
  elegirInv(data.inversion.id); S.tab = 'resumen'; render();
}
function exportar() {
  const i = inv(), blob = new Blob([JSON.stringify({ inversion: i, movimientos: S.movs }, null, 1)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `respaldo-${i.id}-${hoy()}.json` });
  a.click(); URL.revokeObjectURL(a.href);
}

// ── Eventos ───────────────────────────────────────────────────
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-act],[data-mov]');
  if (!t) return;
  if (t.dataset.tab) { e.preventDefault(); S.tab = t.dataset.tab; S.f.papelera = false; render(); scrollTo(0, 0); return; }
  if (t.dataset.mov && !t.dataset.act) return formMov(structuredClone(S.movs.find((m) => m.id === t.dataset.mov)));
  const act = t.dataset.act;
  try {
    if (act === 'entrar') await api.entrar();
    else if (act === 'salir') { e.preventDefault(); await api.salir(); }
    else if (act === 'cerrar') dlg.close();
    else if (act === 'menuMas') menuMas();
    else if (act === 'fijo') {
      const it = estadoMes(inv(), S.movs, ym(hoy())).items[+t.dataset.n], x = inv().compromisos?.find((c) => c.id === it.compromiso);
      formMov({ tipo: it.tipo, categoria: it.categoria, valor: it.valor, compromiso: it.compromiso,
        concepto: x ? `${x.nombre} · cuota ${cuotasPagadas(x, S.movs) + 1}` : it.concepto });
    }
    else if (act === 'nuevoPago') formMov({ tipo: 'gasto', categoria: 'Mantenimiento y arreglos' });
    else if (act === 'recibir') formMov({ tipo: 'aporte', cuenta: inv().cajas[0].id });
    else if (act === 'pagarCaja') formMov({ tipo: 'gasto', cuenta: inv().cajas[0].id });
    else if (act === 'otroCaja') formCaja({ cuenta: inv().cajas[0].id });
    else if (act === 'verComo') { S.verComo = t.dataset.v ? JSON.parse(t.dataset.v) : null; S.tab = S.verComo?.caja ? 'caja' : 'resumen'; render(); scrollTo(0, 0); }
    else if (act === 'papelera') { S.f.papelera = !S.f.papelera; render(); scrollTo(0, 0); }
    else if (act === 'restaurar') await restaurar(t.dataset.id);
    else if (act === 'borrarSiempre') { const m = S.papelera.find((x) => x.id === t.dataset.id); if (confirm(`¿Borrar "${m.concepto}" para siempre? Esto sí no se puede deshacer.`)) await api.borrarMov(m.id); }
    else if (act === 'quitarAcceso') { if (confirm(`¿Quitarle el acceso a ${t.dataset.email}?`)) await api.borrarAcceso(t.dataset.email); }
    else if (act === 'abono') formMov({ tipo: 'ajuste', categoria: 'Abono entre socios' });
    else if (act === 'recordatorio') formRecordatorio(t.dataset.id);
    else if (act === 'nuevaInv') formNuevaInv();
    else if (act === 'exportar') exportar();
    else if (act === 'hecho') {
      const i = inv(), r = i.recordatorios.find((x) => x.id === t.dataset.id);
      const resto = i.recordatorios.filter((x) => x.id !== r.id);
      const sig = r.repite === 'no' ? null : { ...r, fecha: sumarMeses(ym(proximaFecha(r, hoy())), r.repite === 'anual' ? 12 : 1) + r.fecha.slice(7) };
      await api.guardarInv({ ...i, recordatorios: sig ? [...resto, sig] : resto });
    } else if (act === 'addCredito') await api.guardarInv({ ...inv(), credito: { banco: '', monto: 0, saldo: 0, saldoFecha: hoy(), proximaCuota: 1, plazo: 180, tasaEA: 12, cuotaSinSubsidio: 0, subsidio: 0, subsidioHastaCuota: 0, seguros: 0, diaPago: 10 } });
    else if (act === 'addContrato') await api.guardarInv({ ...inv(), contrato: { inicio: hoy(), meses: 12, canon: 0, diaPago: '5 al 10', deposito: 0, modalidad: 'Directo' } });
  } catch (err) { alert(err.message); }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.mov,.cajaf')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset.f && t.dataset.f !== 'q') { S.f[t.dataset.f] = t.value; render(); } // la búsqueda ya se maneja en 'input'
  else if (t.dataset.act === 'inv') { elegirInv(t.value); render(); }
  else if (t.dataset.act === 'importar' && t.files[0]) { try { await importarArchivo(t.files[0]); } catch (err) { alert(err.message); } t.value = ''; }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f === 'q') { S.f.q = t.value; const pos = t.selectionStart; render(); const n = $('[data-f=q]'); n.focus(); n.setSelectionRange(pos, pos); }
  const sim = t.closest('[data-act=simular]');
  if (sim) {
    const cr = inv().credito, c = cur(), base = proyeccion(cr);
    $('#sim').innerHTML = simular(cr, c, leerValor(sim.u.value, c), leerValor(sim.m.value, c), base, sumarMeses(ym(cr.saldoFecha), 1));
  }
});
document.addEventListener('submit', async (e) => {
  if (e.target.dataset.act === 'acceso') {
    e.preventDefault();
    const fd = new FormData(e.target), email = fd.get('email').trim().toLowerCase(), x = JSON.parse(fd.get('rol'));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return alert('Revisa el correo.');
    try { await api.guardarAcceso(email, x); }
    catch (err) { alert(`No se pudo guardar: ${err.message}`); }
    return;
  }
  if (e.target.dataset.act !== 'datos') return;
  e.preventDefault();
  const i = structuredClone(inv()), fd = new FormData(e.target), c = i.moneda;
  for (const [, campos] of CAMPOS) for (const [p, , tipo] of campos) if (fd.has(p)) poner(i, p, tipo === 'n' ? leerValor(fd.get(p), 'USD') : fd.get(p).trim());
  i.socios.forEach((s, k) => { s.nombre = fd.get(`socio.${k}.nombre`).trim(); s.pct = leerValor(fd.get(`socio.${k}.pct`), 'USD'); });
  (i.fijos || []).forEach((f, k) => (f.valor = leerValor(fd.get('fijo.' + k), c)));
  const suma = i.socios.reduce((a, s) => a + s.pct, 0);
  if (Math.abs(suma - 100) > 0.01) return alert(`Los porcentajes suman ${suma}%. Deben sumar 100%.`);
  try { await api.guardarInv(i); alert('Cambios guardados.'); } catch (err) { alert(`No se pudo guardar: ${err.message}`); }
});

// ── Inicio ────────────────────────────────────────────────────
if (window.SEED) vistaPrevia(window.SEED);
else if (FIREBASE_CONFIG) conectarFirebase().catch((e) => { api = null; S.error = `No se pudo conectar con Firebase: ${e.message}`; S.cargando = false; render(); });
else { S.cargando = false; S.error = 'Falta pegar el firebaseConfig de Firebase en index.html.'; }
render();
</script>
